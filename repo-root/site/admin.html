<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShizuKa 管理画面</title>
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body class="admin">
    <header class="admin-header">
      <div>
        <h1>ShizuKa 管理画面</h1>
        <p class="admin-sub">予約・枠・プラン管理</p>
      </div>
      <div class="admin-user">
        <span class="js-admin-user">未ログイン</span>
        <button class="admin-btn admin-btn--ghost js-admin-logout" type="button" disabled>ログアウト</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-card">
        <h2>ログイン</h2>
        <form class="admin-form js-admin-login">
          <label>
            <span>メールアドレス</span>
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label>
            <span>パスワード</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="admin-btn" type="submit">ログイン</button>
          <p class="admin-error js-admin-login-error"></p>
        </form>
      </section>

      <section class="admin-card">
        <h2>予約一覧</h2>
        <form class="admin-form admin-form--inline js-reservation-filter">
          <label>
            <span>状態</span>
            <select name="status">
              <option value="">すべて</option>
              <option value="CONFIRMED">CONFIRMED</option>
              <option value="CANCELLED">CANCELLED</option>
            </select>
          </label>
          <label>
            <span>日付</span>
            <input type="date" name="reservationDate" />
          </label>
          <label>
            <span>氏名</span>
            <input type="text" name="customerName" />
          </label>
          <button class="admin-btn admin-btn--ghost" type="submit">検索</button>
        </form>
        <div class="admin-split">
          <div>
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>日付</th>
                  <th>時間</th>
                  <th>プラン</th>
                  <th>氏名</th>
                  <th>状態</th>
                </tr>
              </thead>
              <tbody class="js-reservation-list">
                <tr><td colspan="6" class="admin-muted">未読込</td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-detail">
            <h3>予約詳細</h3>
            <div class="js-reservation-detail admin-muted">予約を選択してください。</div>
          </div>
        </div>
      </section>

      <section class="admin-card">
        <h2>枠の開閉</h2>
        <form class="admin-form admin-form--inline js-slot-filter">
          <label>
            <span>プランID</span>
            <input type="number" name="planId" min="1" />
          </label>
          <label>
            <span>日付</span>
            <input type="date" name="slotDate" />
          </label>
          <label>
            <span>公開</span>
            <select name="isOpen">
              <option value="">すべて</option>
              <option value="true">開放</option>
              <option value="false">閉鎖</option>
            </select>
          </label>
          <button class="admin-btn admin-btn--ghost" type="submit">検索</button>
        </form>
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>プランID</th>
              <th>日付</th>
              <th>時間</th>
              <th>定員</th>
              <th>予約</th>
              <th>公開</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody class="js-slot-list">
            <tr><td colspan="8" class="admin-muted">未読込</td></tr>
          </tbody>
        </table>
      </section>

      <section class="admin-card">
        <h2>プラン編集</h2>
        <div class="admin-split">
          <div>
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>名称</th>
                  <th>時間</th>
                  <th>料金</th>
                </tr>
              </thead>
              <tbody class="js-plan-list">
                <tr><td colspan="4" class="admin-muted">未読込</td></tr>
              </tbody>
            </table>
          </div>
          <form class="admin-form js-plan-form">
            <input type="hidden" name="id" />
            <label>
              <span>名称</span>
              <input type="text" name="name" required />
            </label>
            <label>
              <span>説明</span>
              <textarea name="description" rows="3"></textarea>
            </label>
            <label>
              <span>所要時間(分)</span>
              <input type="number" name="durationMinutes" min="1" required />
            </label>
            <label>
              <span>料金</span>
              <input type="number" name="price" min="0" required />
            </label>
            <label>
              <span>定員</span>
              <input type="number" name="capacity" min="1" required />
            </label>
            <button class="admin-btn" type="submit">更新</button>
            <p class="admin-error js-plan-error"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="assets/js/admin.js"></script>
  </body>
</html>
