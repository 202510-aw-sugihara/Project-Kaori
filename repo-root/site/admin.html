<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShizuKa 管理画面</title>
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body class="admin">
    <header class="admin-header">
      <div>
        <h1>ShizuKa 管理画面</h1>
        <p class="admin-sub">予約・枠・プラン管理</p>
      </div>
      <div class="admin-user">
        <span class="js-admin-user">未ログイン</span>
        <button class="admin-btn admin-btn--ghost js-admin-logout" type="button" disabled>ログアウト</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-card">
        <h2>ログイン</h2>
        <form class="admin-form js-admin-login">
          <label>
            <span>メールアドレス</span>
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label>
            <span>パスワード</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="admin-btn" type="submit">ログイン</button>
          <p class="admin-error js-admin-login-error"></p>
        </form>
      </section>

      <section class="admin-card">
        <h2>予約一覧</h2>
        <form class="admin-form admin-form--inline js-reservation-filter">
          <label>
            <span>状態</span>
            <select name="status">
              <option value="">すべて</option>
              <option value="CONFIRMED">CONFIRMED</option>
              <option value="CANCELLED">CANCELLED</option>
            </select>
          </label>
          <label>
            <span>日付</span>
            <input type="date" name="reservationDate" />
          </label>
          <label>
            <span>氏名</span>
            <input type="text" name="customerName" />
          </label>
          <button class="admin-btn admin-btn--ghost" type="submit">検索</button>
        </form>
        <div class="admin-split">
          <div>
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>日付</th>
                  <th>時間</th>
                  <th>プラン</th>
                  <th>氏名</th>
                  <th>状態</th>
                </tr>
              </thead>
              <tbody class="js-reservation-list">
                <tr><td colspan="6" class="admin-muted">未読込</td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-detail">
            <h3>予約詳細</h3>
            <div class="js-reservation-detail admin-muted">予約を選択してください。</div>
          </div>
        </div>
      </section>

      <section class="admin-card">
        <h2>枠の開閉</h2>
        <form class="admin-form admin-form--inline js-slot-filter">
          <label>
            <span>プランID</span>
            <input type="number" name="planId" min="1" />
          </label>
          <label>
            <span>日付</span>
            <input type="date" name="slotDate" />
          </label>
          <label>
            <span>公開</span>
            <select name="isOpen">
              <option value="">すべて</option>
              <option value="true">開放</option>
              <option value="false">閉鎖</option>
            </select>
          </label>
          <button class="admin-btn admin-btn--ghost" type="submit">検索</button>
        </form>
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>プランID</th>
              <th>日付</th>
              <th>時間</th>
              <th>定員</th>
              <th>予約</th>
              <th>公開</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody class="js-slot-list">
            <tr><td colspan="8" class="admin-muted">未読込</td></tr>
          </tbody>
        </table>
      </section>

      <section class="admin-card">
        <h2>プラン編集</h2>
        <div class="admin-split">
          <div>
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>名称</th>
                  <th>時間</th>
                  <th>料金</th>
                </tr>
              </thead>
              <tbody class="js-plan-list">
                <tr><td colspan="4" class="admin-muted">未読込</td></tr>
              </tbody>
            </table>
          </div>
          <form class="admin-form js-plan-form">
            <input type="hidden" name="id" />
            <label>
              <span>名称</span>
              <input type="text" name="name" required />
            </label>
            <label>
              <span>説明</span>
              <textarea name="description" rows="3"></textarea>
            </label>
            <label>
              <span>所要時間(分)</span>
              <input type="number" name="durationMinutes" min="1" required />
            </label>
            <label>
              <span>料金</span>
              <input type="number" name="price" min="0" required />
            </label>
            <label>
              <span>定員</span>
              <input type="number" name="capacity" min="1" required />
            </label>
            <button class="admin-btn" type="submit">更新</button>
            <p class="admin-error js-plan-error"></p>
          </form>
        </div>
      </section>
      <section class="admin-card">
        <h2>予約作成</h2>
        <div class="admin-split admin-split--reservation-create">
          <form class="admin-form js-admin-create-reservation" novalidate>
            <div class="admin-alert admin-alert--info js-create-login-notice">先に管理者ログインしてください。ログイン後に予約作成フォームを利用できます。</div>
            <div class="admin-alert admin-alert--error admin-create-alert js-create-reservation-error" hidden></div>
            <div class="admin-alert admin-alert--success admin-create-alert js-create-reservation-success" hidden></div>

            <div class="admin-form-grid">
              <label>
                <span>プラン</span>
                <select name="planId" required>
                  <option value="">プランを選択</option>
                </select>
                <span class="admin-field-error" data-error-for="planId"></span>
              </label>

              <label>
                <span>日付</span>
                <input type="date" name="slotDate" required />
                <span class="admin-field-error" data-error-for="slotDate"></span>
              </label>

              <label class="admin-form-actions admin-form-actions--compact">
                <span>空き枠</span>
                <button class="admin-btn admin-btn--ghost js-load-create-slots" type="button">空き枠を読み込む</button>
              </label>

              <label>
                <span>時間枠</span>
                <select name="planTimeSlotId" required disabled>
                  <option value="">先に空き枠を読み込んでください</option>
                </select>
                <span class="admin-field-help js-create-slot-help">プランと日付を選択して、空き枠を読み込んでください。</span>
                <span class="admin-field-error" data-error-for="planTimeSlotId"></span>
              </label>

              <label>
                <span>顧客名</span>
                <input type="text" name="customerName" maxlength="100" required />
                <span class="admin-field-error" data-error-for="customerName"></span>
              </label>

              <label>
                <span>メールアドレス</span>
                <input type="email" name="email" maxlength="255" required />
                <span class="admin-field-error" data-error-for="email"></span>
              </label>

              <label>
                <span>電話番号</span>
                <input type="tel" name="phone" maxlength="20" required />
                <span class="admin-field-error" data-error-for="phone"></span>
              </label>

              <label>
                <span>参加人数</span>
                <input type="number" name="participantCount" min="1" max="20" value="1" required />
                <span class="admin-field-error" data-error-for="participantCount"></span>
              </label>
            </div>

            <div class="admin-participants">
              <div class="admin-section-head">
                <h3>参加者情報</h3>
                <p class="admin-muted">参加人数に応じて入力欄が切り替わります。</p>
              </div>
              <div class="admin-participant-list js-create-participant-list"></div>
              <span class="admin-field-error" data-error-for="participants"></span>
            </div>

            <div class="admin-form-actions">
              <button class="admin-btn admin-btn--ghost js-create-preview" type="button">確認</button>
              <button class="admin-btn js-create-submit" type="submit" disabled>予約を登録</button>
              <button class="admin-btn admin-btn--ghost js-create-reset" type="reset">リセット</button>
            </div>
          </form>

          <aside class="admin-detail admin-preview-panel">
            <h3>入力内容の確認</h3>
            <div class="js-create-reservation-preview admin-muted">
              フォームを入力して「確認」を押すと、登録前に内容を確認できます。
            </div>
          </aside>
        </div>
      </section>
    </main>

    <script src="assets/js/admin.js"></script>
  </body>
</html>
