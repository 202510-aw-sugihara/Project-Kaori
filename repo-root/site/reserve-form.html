<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約: 情報入力 | オリジナル香水作り体験</title>
  <link rel="stylesheet" href="assets/css/perfume.css">
</head>
<body class="perfume-site p-app-page">
  <div class="p-app-shell">
    <p class="p-app-logo"><img src="images/logo-cropped.png" alt="SHIZUKA"></p>
    <header class="p-app-step" aria-label="予約ステップ">
      <p class="p-app-step__label">情報入力</p>
      <p class="p-app-step__trail">✓コース → ✓日程 → ✓人数</p>
    </header>

    <main class="p-app-main">
  <div class="p-reservation-stop" hidden role="status" aria-live="polite">
    <p>現在、システム調整のためオンライン予約を一時停止しております。</p>
    <p>再開まで今しばらくお待ちください。</p>
    <p>お急ぎのお客様は店舗へ直接お問い合わせください。</p>
  </div>
  <noscript>
    <div class="p-reservation-stop" data-noscript="true">
      <p>現在、システム調整のためオンライン予約を一時停止しております。</p>
      <p>再開まで今しばらくお待ちください。</p>
      <p>お急ぎのお客様は店舗へ直接お問い合わせください。</p>
    </div>
  </noscript>
      <h1>情報入力</h1>
      <section class="p-app-panel">
        <form class="p-app-form js-reserve-form" novalidate>
          <div class="p-form__group">
            <label class="p-form__label" for="name">お名前（カタカナ）</label>
            <input class="p-form__input" id="name" name="name" type="text" autocomplete="name">
            <p class="p-app-inline-note">※全角カタカナでご入力ください（例：アシカガ タカウジ）</p>
            <p class="p-form__error" data-error="name"></p>
          </div>

          <div class="p-form__group">
            <label class="p-form__label" for="email">メールアドレス</label>
            <input class="p-form__input" id="email" name="email" type="email" autocomplete="email">
            <p class="p-form__error" data-error="email"></p>
          </div>

          <div class="p-form__group">
            <label class="p-form__label" for="phone">電話番号 <span class="p-app-inline-note">※ハイフンは入れずに入力してください。</span></label>
            <input class="p-form__input" id="phone" name="phone" type="tel" autocomplete="tel">
            <p class="p-form__error" data-error="phone"></p>
          </div>

          <div class="p-form__group">
            <p class="p-form__label">香りの方向性（任意） <span class="p-form__label-sub">Preferred scent direction (optional)</span></p>
            <div class="p-form__radio-cards" role="radiogroup" aria-label="香りの方向性（任意）">
              <label class="p-form__radio-card">
                <input class="p-form__radio" type="radio" name="scentDirection" value="natural">
                <span class="p-form__radio-content">
                  <span class="p-form__radio-title">🌿 Natural &amp; Relaxing</span>
                  <span class="p-form__radio-desc">森やハーブのような落ち着いた香り</span>
                </span>
              </label>
              <label class="p-form__radio-card">
                <input class="p-form__radio" type="radio" name="scentDirection" value="floral">
                <span class="p-form__radio-content">
                  <span class="p-form__radio-title">🌸 Floral &amp; Romantic</span>
                  <span class="p-form__radio-desc">花のように華やかで優しい印象</span>
                </span>
              </label>
              <label class="p-form__radio-card">
                <input class="p-form__radio" type="radio" name="scentDirection" value="fresh">
                <span class="p-form__radio-content">
                  <span class="p-form__radio-title">🍋 Fresh &amp; Clean</span>
                  <span class="p-form__radio-desc">爽やかで透明感のある軽やかな香り</span>
                </span>
              </label>
              <label class="p-form__radio-card">
                <input class="p-form__radio" type="radio" name="scentDirection" value="elegant">
                <span class="p-form__radio-content">
                  <span class="p-form__radio-title">🌙 Deep &amp; Elegant</span>
                  <span class="p-form__radio-desc">落ち着きと奥行きのある大人の香り</span>
                </span>
              </label>
            </div>
            <p class="p-app-inline-note">※当日変更可能です。You can change this on the day.</p>
          </div>

          <div class="p-form__group">
            <label class="p-form__label" for="scentNote">その他イメージがあればご記入ください（任意） <span class="p-form__label-sub">Additional notes (optional)</span></label>
            <textarea class="p-form__textarea" id="scentNote" name="scentNote" rows="3"></textarea>
          </div>

          <div class="p-form__group">
            <label class="p-form__label" for="note">備考</label>
            <textarea class="p-form__textarea" id="note" name="note" rows="4"></textarea>
          </div>

          <div class="p-app-form-price" aria-label="料金確認">
            <p><span>コース</span><span class="js-form-course">-</span></p>
            <p><span>日時</span><span class="js-form-date">-</span></p>
            <p><span>人数</span><span class="js-form-people">-</span></p>
            <p><span class="js-form-calc">¥4,000 × 2</span><span></span></p>
            <p><span>合計</span><span class="js-form-total">¥8,000</span></p>
          </div>

          <p class="p-app-button-row">
            <button class="p-app-btn p-app-btn--dark" type="submit">確認画面へ</button>
          </p>
        </form>
      </section>
    </main>

    <nav class="p-app-backbar" aria-label="ページ移動">
      <a href="reserve.html"><span aria-hidden="true">❮</span> 1つ前に戻る</a>
      <a class="p-app-next" href="reserve-confirm.html" aria-label="次へ"><span aria-hidden="true">❯</span></a>
    </nav>
  </div>
  <script src="assets/js/ops-config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
