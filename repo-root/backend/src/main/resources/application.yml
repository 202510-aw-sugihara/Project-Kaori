spring:
  application:
    name: shizuka-backend
  sql:
    init:
      mode: always
      schema-locations: classpath:/schema.sql

  datasource:
    url: jdbc:h2:mem:shizuka;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  mapper-locations: classpath*:mapper/**/*.xml

logging:
  level:
    root: INFO
    com.example.shizuka: DEBUG

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /
