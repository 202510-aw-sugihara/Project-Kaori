<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約: コース選択 | オリジナル香水作り体験</title>
  <link rel="stylesheet" href="assets/css/perfume.css">
</head>

<body class="perfume-site p-app-page">
  <div class="p-app-shell">
    <p class="p-app-logo">LOGO</p>
    <header class="p-app-step" aria-label="予約ステップ">
      <p class="p-app-step__label">コース確認</p>
      <p class="p-app-step__trail">日程 → 人数 → 情報入力</p>
    </header>

    <main class="p-app-main">
      <h1>コース選択</h1>
      <section class="p-app-panel" aria-labelledby="course-title">
        <h2 id="course-title" class="u-visually-hidden">コース一覧</h2>
        <div class="p-app-courses">
          <article class="p-app-course">
            <h2>12種ブレンド体験</h2>
            <dl>
              <div>
                <dt>コース</dt>
                <dd>初心者向けコース</dd>
              </div>
              <div>
                <dt>所要時間</dt>
                <dd>約60分</dd>
              </div>
              <div>
                <dt>料金</dt>
                <dd>¥4,000</dd>
              </div>
            </dl>
            <p class="p-app-button-row">
              <button class="p-app-btn p-app-btn--muted js-course-select" type="button" data-course-id="12blend"
                data-course-name="12種ブレンド体験" data-course-label="初心者向けコース" data-course-price="4000"
                data-course-duration="約60分">日程を選択する</button>
            </p>
          </article>
          <article class="p-app-course">
            <h2>20種ブレンド体験</h2>
            <dl>
              <div>
                <dt>コース</dt>
                <dd>月末限定コース</dd>
              </div>
              <div>
                <dt>所要時間</dt>
                <dd>約60分</dd>
              </div>
              <div>
                <dt>料金</dt>
                <dd>¥4,000</dd>
              </div>
            </dl>
            <p class="p-app-button-row">
              <button class="p-app-btn p-app-btn--muted js-course-select" type="button" data-course-id="20blend"
                data-course-name="20種ブレンド体験（月末限定）" data-course-label="月末限定コース" data-course-price="4000"
                data-course-duration="約60分">日程を選択する</button>
            </p>
          </article>
        </div>
      </section>
    </main>

    <nav class="p-app-backbar" aria-label="ページ移動">
      <a href="index.html"><span aria-hidden="true">❮</span> ホームページに戻る</a>
      <span class="p-app-next" aria-hidden="true">❯</span>
    </nav>
  </div>
  <script src="assets/js/main.js"></script>
</body>

</html>
